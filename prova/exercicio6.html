<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Exercício 6 - Ordem Crescente</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(to right, #232526, #414345);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background-color: #2e2e3a;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }

    h2 {
      color: #00c6ff;
      margin-bottom: 20px;
    }

    input[type="number"] {
      padding: 10px;
      width: 100%;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    button, .voltar {
      padding: 12px 20px;
      background-color: #00c6ff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: block;
      margin-top: 10px;
    }

    button:hover, .voltar:hover {
      background-color: #0072ff;
    }
  </style>
