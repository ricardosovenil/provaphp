<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercício 2 - Tabuada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #23232e, #101018);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      background: #2d2d44;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: #00c6ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0072ff;
    }

    a.voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #a0d4ff;
      text-decoration: none;
    }

    a.voltar:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Exercício 2 - Tabuada</h2>
    <form method="post" action="exercicio2.php">
      <label for="numero">Digite um número inteiro:</label>
      <input type="number" name="numero" id="numero" required>
      <button type="submit">Exibir Tabuada</button>
    </form>
    <a class="voltar" href="index.html">← Voltar para a Página Inicial</a>
  </div>
</body>
</html>
