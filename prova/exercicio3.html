<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercício 3 - Fatorial</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(120deg, #1e1e2f, #12121d);
      color: #fff;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #2a2a40;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
      background: linear-gradient(90deg, #ffcc00, #ff8800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      background-color: #ff8800;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #ff9900;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #a0d4ff;
      text-decoration: none;
    }

    .voltar:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Exercício 3 - Fatorial</h2>
    <form action="exercicio3.php" method="post">
      <label for="numero">Digite um número inteiro:</label>
      <input type="number" name="numero" id="numero" required min="0">
      <button type="submit">Calcular Fatorial</button>
    </form>
    <a class="voltar" href="index.html">← Voltar para o Início</a>
  </div>
</body>
</html>
