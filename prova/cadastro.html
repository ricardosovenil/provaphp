<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Alunos</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1f1f2e;
      color: white;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    form {
      background: #2e2e40;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
    }

    h2 {
      text-align: center;
      color: #00c6ff;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #00c6ff;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background-color: #0072ff;
    }
  </style>
</head>
<body>
  <form action="cadastro.php" method="post">
    <h2>Cadastro de Aluno</h2>
    <label>Nome</label><input name="nome" required>
    <label>Matrícula</label><input name="matricula" required>
    <label>Curso</label><input name="curso" required>
    <label>Email Institucional</label><input name="email" type="email" required>
    <label>Telefone</label><input name="telefone" required>
    <label>Endereço</label><input name="endereco" required>
    <label>CEP</label><input name="cep" required>
    <label>Cidade</label><input name="cidade" required>
    <label>UF</label><input name="uf" required>
    <label>Curso para Horas Complementares</label><input name="curso_horas" required>
    <label>Carga Horária</label><input name="carga_horaria" type="number" required>
    <button type="submit">Cadastrar</button>
  </form>
</body>
</html>
