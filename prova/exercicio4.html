<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercício 4 - Calculadora</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(120deg, #1e1e2f, #12121d);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #2a2a40;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      background-color: #00ccff;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #00b0e0;
    }

    .voltar {
      text-align: center;
      display: block;
      margin-top: 20px;
      color: #a0d4ff;
      text-decoration: none;
    }

    .voltar:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Exercício 4 - Calculadora</h2>
    <form action="exercicio4.php" method="post">
      <label for="num1">Número 1:</label>
      <input type="number" name="num1" id="num1" required step="any">

      <label for="num2">Número 2:</label>
      <input type="number" name="num2" id="num2" required step="any">

      <label for="operacao">Operação:</label>
      <select name="operacao" id="operacao" required>
        <option value="soma">Soma (+)</option>
        <option value="subtracao">Subtração (-)</option>
        <option value="multiplicacao">Multiplicação (×)</option>
        <option value="divisao">Divisão (÷)</option>
      </select>

      <button type="submit">Calcular</button>
    </form>
    <a class="voltar" href="index.html">← Voltar para o Início</a>
  </div>
</body>
</html>
